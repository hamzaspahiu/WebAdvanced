<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--these are block elements-->
    <h1>This is a block element</h1>
    <p>This is a block element</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>   
    </ul>

    <!--these are inline elments-->
    <img src="images/digitalschool.jpg" alt="digital school">
    <a href="https://digitalschool.eu/">Digital school</a>
    <cite>this is a cite</cite>
    <strong>this is a strong element</strong>
    <span>this is a span</span>

    <hr>

    <iframe name="iframe_ds" title="frame_example"></iframe>
    <p><a href="https://digitalschool.eu/" target="iframe_ds">digital school</a></p>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/jNQXAC9IVRw?si=A6NWwmE91oIxfBZC" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
